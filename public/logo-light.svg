<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gemGradLight" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669" />
      <stop offset="0.5" stop-color="#0d9488" />
      <stop offset="1" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="orbitGradLight" x1="2" y1="16" x2="30" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669" />
      <stop offset="1" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- High-contrast Light Theme Rounded Surface -->
  <rect width="32" height="32" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  
  <!-- Outer Protective Octagon -->
  <polygon
    points="16,4 26,8.5 26,23.5 16,28 6,23.5 6,8.5"
    stroke="url(#orbitGradLight)"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner Gem Facet Lattice -->
  <polygon
    points="16,7.5 22.5,11 22.5,21 16,24.5 9.5,21 9.5,11"
    fill="url(#gemGradLight)"
    fill-opacity="0.18"
    stroke="url(#gemGradLight)"
    stroke-width="1.4"
  />

  <!-- Core Radiant Nucleus & Accents -->
  <circle cx="16" cy="16" r="3.2" fill="#059669" />
  <circle cx="16" cy="16" r="5" stroke="#059669" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.8" />
  <line x1="16" y1="4" x2="16" y2="7.5" stroke="#059669" stroke-width="1.4" stroke-linecap="round" />
  <line x1="16" y1="24.5" x2="16" y2="28" stroke="#0284c7" stroke-width="1.4" stroke-linecap="round" />
  <line x1="6" y1="16" x2="9.5" y2="16" stroke="#059669" stroke-width="1.4" stroke-linecap="round" />
  <line x1="22.5" y1="16" x2="26" y2="16" stroke="#0284c7" stroke-width="1.4" stroke-linecap="round" />
</svg>
