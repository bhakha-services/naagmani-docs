<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gemGradDark" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399" />
      <stop offset="0.5" stop-color="#10b981" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="orbitGradDark" x1="2" y1="16" x2="30" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Dark Theme Rounded Surface -->
  <rect width="32" height="32" rx="8" fill="#07090e" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
  
  <!-- Outer Protective Octagon -->
  <polygon
    points="16,4 26,8.5 26,23.5 16,28 6,23.5 6,8.5"
    stroke="url(#gemGradDark)"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner Gem Facet Lattice -->
  <polygon
    points="16,7.5 22.5,11 22.5,21 16,24.5 9.5,21 9.5,11"
    fill="url(#gemGradDark)"
    fill-opacity="0.25"
    stroke="url(#gemGradDark)"
    stroke-width="1.5"
  />

  <!-- Core Radiant Nucleus & Accents -->
  <circle cx="16" cy="16" r="3.2" fill="#34d399" />
  <circle cx="16" cy="16" r="5" stroke="#34d399" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.8" />
  <line stroke="url(#gemGradDark)" x1="16" y1="4" x2="16" y2="7.5" stroke-width="1.5" stroke-linecap="butt" />
  <line stroke="url(#gemGradDark)" x1="16" y1="24.5" x2="16" y2="28" stroke-width="1.5" stroke-linecap="butt" />
  <line stroke="url(#gemGradDark)" x1="6" y1="16" x2="9.5" y2="16" stroke-width="1.5" stroke-linecap="butt" />
  <line stroke="url(#gemGradDark)" x1="22.5" y1="16" x2="26" y2="16" stroke-width="1.5" stroke-linecap="butt" />
</svg>
